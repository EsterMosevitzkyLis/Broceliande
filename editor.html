<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Map editor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M5 27C5 12 13 4 28 4c0 15-8 23-23 23z' fill='%234c7f58'/%3E%3Cpath d='M5 27L21 11' stroke='%23d9ead0' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E"><!-- a leaf, drawn inline (no asset files) -->
  <!-- The game's styles, for the hidden copy of its stage the UI-area checks measure (M4a §5.4). -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="editor/editor.css">
</head>
<body class="map-editor">
  <!-- Top bar (M4a §5.1). -->
  <header id="ed-top">
    <span class="ed-title">Map editor</span>
    <select id="ed-level" title="Level"></select>
    <button id="ed-save" type="button" disabled>Save</button>
    <span id="ed-dirty" title="No unsaved changes"></span>
    <button id="ed-undo" type="button" disabled title="Undo (Ctrl+Z)">Undo</button>
    <button id="ed-redo" type="button" disabled title="Redo (Ctrl+Y)">Redo</button>
    <button id="ed-preview" type="button" title="Roll the level's layout with a seed, as the game would">Preview a run</button>
    <button id="ed-play" type="button" title="Open the game at this level's Prep, in a new tab">Play this level</button>
    <label class="ed-inline" title="Start with the debug resource grant (debug G)"><input id="ed-play-debug" type="checkbox"> debug resources</label>
    <button id="ed-draft-button" type="button" title="Generate a starting point for the level, or one layer of it">Generate draft</button>
    <span id="ed-status"></span>
    <span id="ed-readonly" hidden></span>
  </header>
  <div id="ed-data-problems" hidden></div>
  <div id="ed-draft" hidden></div>

  <div id="ed-main">
    <!-- Left toolbar: the tools (M4a §5.3). -->
    <nav id="ed-tools">
      <button type="button" data-tool="select" title="Select and move (V)">Select</button>
      <button type="button" data-tool="lanes" title="Lanes: waypoints (L)">Lanes</button>
      <button type="button" data-tool="druid" title="Druid and sectors (D)">Druid</button>
      <button type="button" data-tool="spots" title="Spots (S)">Spots</button>
      <button type="button" data-tool="place" title="Place decoration (P)">Place</button>
      <button type="button" data-tool="scatter" title="Scatter brush (B)">Scatter</button>
      <button type="button" data-tool="mire" title="Mire brush (M)">Mire</button>
      <button type="button" data-tool="palette" title="Palette">Palette</button>
      <button type="button" data-tool="background" title="Background image">Background</button>
    </nav>

    <main id="ed-centre">
      <canvas id="ed-canvas"></canvas>
    </main>

    <!-- Right panel: selection, layers, snap, checks. -->
    <aside id="ed-panel">
      <section id="ed-preview-panel" hidden>
        <h2>Preview a run</h2>
        <div class="ed-choice"><button id="ed-preview-prev" type="button">Previous seed</button><span id="ed-preview-seed"></span><button id="ed-preview-next" type="button">Next seed</button></div>
        <div id="ed-preview-summary"></div>
      </section>
      <section class="ed-tool-section">
        <h2>Tool</h2>
        <div id="ed-tool-help"></div>
        <div id="ed-tool-options" hidden></div>
        <div id="ed-tool-extra"></div>
      </section>
      <section>
        <h2>Selection</h2>
        <div id="ed-selection"></div>
        <div id="ed-selection-edit"></div>
        <div id="ed-decor-actions" class="ed-choice" hidden></div>
      </section>
      <section>
        <h2>Level</h2>
        <label class="ed-slider">Corridor width
          <input id="ed-corridor-width" type="range" min="60" max="240" step="2">
          <span id="ed-corridor-width-value"></span>
        </label>
        <div id="ed-sectors"></div>
        <details class="ed-details" open>
          <summary>Level rules</summary>
          <div id="ed-level-rules"></div>
        </details>
      </section>
      <section id="ed-zone-rules-section" hidden>
        <h2>Zone rules</h2>
        <div id="ed-zone-rules"></div>
      </section>
      <section>
        <details class="ed-details">
          <summary>Level data (from the sheet)</summary>
          <div id="ed-level-data"></div>
        </details>
      </section>
      <section>
        <h2>Layers</h2>
        <div id="ed-layers"></div>
        <label class="ed-snap">Snap to grid
          <select id="ed-snap"><option value="0">off</option><option value="10">10 px</option><option value="20">20 px</option></select>
        </label>
      </section>
      <section class="ed-checks-section">
        <h2>Checks <span id="ed-checks-summary"></span> <span id="ed-checking" hidden>checking…</span></h2>
        <div id="ed-format-note" hidden>This file isn't in the editor's layout; saving rewrites it.</div>
        <div id="ed-new-note" hidden>No map file yet: Generate draft for a starting point, then Save to create it.</div>
        <div id="ed-checks"></div>
      </section>
    </aside>
  </div>

  <div id="ed-measure" aria-hidden="true"></div>
  <div id="ed-loading">Loading…</div>

  <script type="module" src="editor/boot.js"></script>
</body>
</html>
